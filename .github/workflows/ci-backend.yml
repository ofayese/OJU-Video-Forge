name: Backend CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend / python-3.12
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: test
      DB_PASSWORD: ci-only-not-a-secret
      DATABASE_URL: postgresql+psycopg://forge:ci-only-not-a-secret@localhost:5432/forge
      REDIS_URL: redis://localhost:6379/0
      FORGE_OPENWEBUI_TOKEN: ci-test-token
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: forge_test
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt
      - name: Check dependency consistency and vulnerabilities
        run: |
          python -m pip check
          pip-audit -r requirements.lock.txt
          pip-audit -r requirements-dev.lock.txt
      - name: Lint, compile, test, and validate OpenAPI
        run: |
          export PGPASSWORD="$DB_PASSWORD"
          export DATABASE_URL="postgresql+psycopg://forge@localhost:5432/forge_test"
          export REDIS_URL="redis://localhost:6379/15"
          ruff check app tests alembic scripts
          python -m compileall -q app tests alembic scripts
          python -m pytest -q -p no:cacheprovider
          python scripts/export_openapi.py --output "$RUNNER_TEMP/openapi.json"
      - name: Validate isolated PostgreSQL migration and Redis connectivity
        run: |
          export PGPASSWORD="$DB_PASSWORD"
          export DATABASE_URL="postgresql+psycopg://forge@localhost:5432/forge_test"
          export REDIS_URL="redis://localhost:6379/15"
          python -m alembic upgrade 0001
          python - <<'PY'
          from datetime import datetime, timezone
          from sqlalchemy import text
          from app.core import engine

          now = datetime.now(timezone.utc)
          with engine.begin() as connection:
              connection.execute(
                  text(
                      "INSERT INTO jobs (id, owner, operation, status, spec, created_at, updated_at) "
                      "VALUES (:id, :owner, :operation, :status, CAST(:spec AS json), :created, :updated)"
                  ),
                  {
                      "id": "migration-legacy-job",
                      "owner": "migration-test",
                      "operation": "render_test",
                      "status": "queued",
                      "spec": '{"operation": "render_test"}',
                      "created": now,
                      "updated": now,
                  },
              )
              connection.execute(
                  text(
                      "INSERT INTO audit_events (job_id, actor, action, at) "
                      "VALUES (:job_id, :actor, :action, :at)"
                  ),
                  {
                      "job_id": "migration-legacy-job",
                      "actor": "migration-test",
                      "action": "queued",
                      "at": now,
                  },
              )
          PY
          python -m alembic upgrade head
          python -c "from sqlalchemy import text; from app.core import engine; assert engine.connect().execute(text(\"SELECT status FROM jobs WHERE id='migration-legacy-job'\")).scalar_one() == 'queued'"
          if python -m alembic downgrade 0001 > "$RUNNER_TEMP/downgrade.log" 2>&1; then
            cat "$RUNNER_TEMP/downgrade.log"
            echo "Expected destructive review schema rollback to be rejected" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/downgrade.log"
          grep -q "Review schema rollback is destructive" "$RUNNER_TEMP/downgrade.log"
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from sqlalchemy import text
          from app.core import engine

          head_revision = ScriptDirectory.from_config(Config("alembic.ini")).get_current_head()
          with engine.connect() as connection:
              assert connection.execute(text("SELECT version_num FROM alembic_version")).scalar_one() == head_revision
              assert connection.execute(text("SELECT count(*) FROM jobs WHERE id='migration-legacy-job'")).scalar_one() == 1
              assert connection.execute(text("SELECT count(*) FROM audit_events")).scalar_one() == 1
          PY
          python -m alembic upgrade head
          python -c "from sqlalchemy import inspect; from app.core import engine; tables=set(inspect(engine).get_table_names()); assert {'jobs','audit_events','projects','media_assets','dispatch_outbox'} <= tables, tables"
          python -c "from redis import Redis; assert Redis.from_url('redis://localhost:6379/15').ping()"

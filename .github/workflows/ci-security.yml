name: Security CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-scans:
    name: security / dependency-scans
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20.12.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked Python audit tools
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt
      - name: Python dependency audit
        run: |
          pip-audit -r requirements.lock.txt
          pip-audit -r requirements-dev.lock.txt
          pip-audit -r requirements-narration.lock.txt
      - name: npm dependency audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=moderate

  codeql:
    name: security / codeql-python-typescript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Required only to publish CodeQL SARIF results for same-repository runs.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python, javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:python,javascript-typescript"
          upload: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  secrets-sbom-containers:
    name: security / secrets-sbom-containers
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.8"
          cache: false
      - name: Install pinned scanners
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/anchore/syft/cmd/syft@v1.57.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Scan tracked source for secrets
        run: gitleaks dir . --redact --no-banner
      - name: Generate CycloneDX dependency and license inventory
        id: sbom
        run: syft dir:. --output cyclonedx-json=sbom.cdx.json
      - name: Build API and worker images for vulnerability assessment
        id: build-images
        run: |
          docker build --pull --tag ovf-api:ci --file services/api/Dockerfile .
          docker build --pull --tag ovf-worker:ci --file services/worker/Dockerfile .
          docker build --pull --tag ovf-narration:ci --file services/narration/Dockerfile .
          docker build --pull --tag ovf-docling:ci --file services/docling-ocr/Dockerfile.docling-ocr .
          {
            for image in ovf-api:ci ovf-worker:ci ovf-narration:ci ovf-docling:ci; do
              printf '%s %s\n' "$image" "$(docker image inspect "$image" --format '{{.Id}}')"
            done
          } > "$RUNNER_TEMP/image-ids.txt"
          docker save ovf-api:ci --output "$RUNNER_TEMP/ovf-api.tar"
          docker save ovf-worker:ci --output "$RUNNER_TEMP/ovf-worker.tar"
          docker save ovf-narration:ci --output "$RUNNER_TEMP/ovf-narration.tar"
      - name: Generate image-specific CycloneDX SBOMs
        id: image-sboms
        if: ${{ always() && steps.build-images.outcome == 'success' }}
        run: |
          for image in api worker narration docling; do
            syft "ovf-${image}:ci" --output "cyclonedx-json=$RUNNER_TEMP/ovf-${image}.sbom.cdx.json"
          done
      - name: Scan API image for vulnerabilities
        if: ${{ always() && steps.build-images.outcome == 'success' }}
        run: >-
          docker run --rm
          -v "$RUNNER_TEMP:/scan"
          aquasec/trivy:0.76.2
          image --input /scan/ovf-api.tar --format json --output /scan/ovf-api.trivy.json
          --exit-code 1 --severity HIGH,CRITICAL
      - name: Scan worker image for vulnerabilities
        if: ${{ always() && steps.build-images.outcome == 'success' }}
        run: >-
          docker run --rm
          -v "$RUNNER_TEMP:/scan"
          aquasec/trivy:0.76.2
          image --input /scan/ovf-worker.tar --format json --output /scan/ovf-worker.trivy.json
          --exit-code 1 --severity HIGH,CRITICAL
      - name: Report optional narration image vulnerabilities
        if: ${{ always() && steps.build-images.outcome == 'success' }}
        run: >-
          docker run --rm
          -v "$RUNNER_TEMP:/scan"
          aquasec/trivy:0.76.2
          image --input /scan/ovf-narration.tar --format json --output /scan/ovf-narration.trivy.json
          --exit-code 0 --severity HIGH,CRITICAL
      - name: Fail on narration image vulnerabilities
        if: ${{ always() && steps.build-images.outcome == 'success' }}
        run: >-
          docker run --rm
          -v "$RUNNER_TEMP:/scan:ro"
          aquasec/trivy:0.76.2
          image --input /scan/ovf-narration.tar --exit-code 1 --severity HIGH,CRITICAL
      - name: Scan Docling image for vulnerabilities
        if: ${{ always() && steps.build-images.outcome == 'success' }}
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$RUNNER_TEMP:/reports"
          aquasec/trivy:0.76.2
          image --format json --output /reports/ovf-docling.trivy.json
          --exit-code 1 --severity HIGH,CRITICAL ovf-docling:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.sbom.outcome == 'success' }}
        with:
          name: container-security-evidence
          path: |
            sbom.cdx.json
            ${{ runner.temp }}/image-ids.txt
            ${{ runner.temp }}/*.sbom.cdx.json
            ${{ runner.temp }}/*.trivy.json
          if-no-files-found: error
          retention-days: 14
      - name: Assess container configuration
        if: always()
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/src:ro"
          aquasec/trivy:0.76.2
          config --exit-code 1 --severity HIGH,CRITICAL /src

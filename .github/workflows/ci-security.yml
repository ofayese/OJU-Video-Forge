name: Security CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-scans:
    name: security / dependency-scans
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20.12.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked Python audit tools
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt
      - name: Python dependency audit
        run: |
          pip-audit -r requirements.lock.txt
          pip-audit -r requirements-dev.lock.txt
      - name: npm dependency audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=moderate

  codeql:
    name: security / codeql-python-typescript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Required only to publish CodeQL SARIF results for same-repository runs.
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: python, javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          category: "/language:python,javascript-typescript"
          upload: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  secrets-sbom-containers:
    name: security / secrets-sbom-containers
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.23.4"
          cache: false
      - name: Install pinned scanners
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/anchore/syft/cmd/syft@v1.57.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Scan tracked source for secrets
        run: gitleaks dir . --redact --no-banner
      - name: Generate CycloneDX dependency and license inventory
        id: sbom
        run: syft dir:. --output cyclonedx-json=sbom.cdx.json
      - name: Build API and worker images for vulnerability assessment
        id: build-images
        run: |
          docker build --pull --tag ovf-api:ci --file services/api/Dockerfile .
          docker build --pull --tag ovf-worker:ci --file services/worker/Dockerfile .
          docker save ovf-api:ci --output "$RUNNER_TEMP/ovf-api.tar"
          docker save ovf-worker:ci --output "$RUNNER_TEMP/ovf-worker.tar"
      - name: Scan API image for vulnerabilities
        if: ${{ always() && steps.build-images.outcome == 'success' }}
        run: >-
          docker run --rm
          -v "$RUNNER_TEMP:/scan:ro"
          aquasec/trivy:0.76.2
          image --input /scan/ovf-api.tar --exit-code 1 --severity HIGH,CRITICAL
      - name: Scan worker image for vulnerabilities
        if: ${{ always() && steps.build-images.outcome == 'success' }}
        run: >-
          docker run --rm
          -v "$RUNNER_TEMP:/scan:ro"
          aquasec/trivy:0.76.2
          image --input /scan/ovf-worker.tar --exit-code 1 --severity HIGH,CRITICAL
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.sbom.outcome == 'success' }}
        with:
          name: dependency-sbom
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
      - name: Assess container configuration
        if: always()
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/src:ro"
          aquasec/trivy:0.76.2
          config --exit-code 1 --severity HIGH,CRITICAL /src

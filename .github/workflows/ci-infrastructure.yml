name: Infrastructure CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-locks:
    name: infrastructure / python-locks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - name: Install locked developer tools
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt
      - name: Verify dependency locks
        run: python scripts/check_dependency_locks.py

  validate:
    name: infrastructure / configuration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.0"
          cache: false
      - name: Install locked validation tools
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt
      - name: Validate repository metadata and configuration
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint .github/workflows/*.yml
          python scripts/validate_repository.py
          python scripts/validate_acceptance_register.py
          python scripts/export_openapi.py --output "$RUNNER_TEMP/openapi.json"
      - name: Validate Compose configuration (do not start services)
        run: |
          docker compose --env-file .env.development.example -f compose.yaml -f compose.dev.yaml config --quiet
          docker compose --env-file .env.development.example -f compose.yaml -f compose.gpu.yaml config --quiet
      - name: Check Dockerfile syntax
        run: |
          docker buildx build --check --file services/api/Dockerfile .
          docker buildx build --check --file services/worker/Dockerfile .
          docker buildx build --check --file services/comfyui/Dockerfile .

services:
  api:
    networks: [backend, control, agent-inference]
    environment:
      NARRATION_VISION_URL: ${NARRATION_VISION_URL:-}
      NARRATION_VISION_MODEL: ${NARRATION_VISION_MODEL:-}
      NARRATION_VISION_MODEL_DIGEST: ${NARRATION_VISION_MODEL_DIGEST:-}

  render-worker:
    networks: [control, inference, narration-ocr, agent-inference]

  ollama:
    image: ollama/ollama:0.40.16@sha256:a372a1c0d1e15b68e9521189785c3ca17795c26c2356f8b1b10122cfb59ed0d7
    platform: linux/amd64
    gpus: all
    cpus: 4.0
    mem_limit: 2g
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    init: true
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: "1"
      HOME: /tmp
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_QUEUE: "1"
      OLLAMA_KEEP_ALIVE: "0"
    volumes: [ollama-models:/models]
    networks: [agent-inference]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  agent-inference:
    internal: true

volumes:
  ollama-models: {}

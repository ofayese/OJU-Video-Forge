[pytest]
# Authoritative test discovery. Only the tests/ package is collected.
#
# Without this, pytest's default discovery walks the repository root and imports
# any top-level "test_*.py". Operator scratch scripts at the root (for example
# test_structured.py, which runs a live `docker exec ... ollama run` at import
# time) were therefore executed during *collection* in every full run. That
# spawned a child process whose UTF-8 output was decoded with the Windows ANSI
# code page, leaking a reader thread that later surfaced as
# PytestUnhandledThreadExceptionWarning and turned an otherwise green run red.
testpaths = tests

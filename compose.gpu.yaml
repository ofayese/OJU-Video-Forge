services:
  api:
    environment:
      COMFYUI_ENABLED: ${COMFYUI_ENABLED:-true}

  comfyui:
    profiles: [gpu]
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]

  render-worker:
    command: ["rq", "worker", "video", "gpu", "--url", "redis://redis:6379/0"]
    environment:
      COMFYUI_URL: http://comfyui:8188
      COMFYUI_ENABLED: ${COMFYUI_ENABLED:-true}
      WAN_NODE_MAPPING: ${WAN_NODE_MAPPING:-{}}

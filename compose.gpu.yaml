services:
  api:
    environment:
      COMFYUI_ENABLED: ${COMFYUI_ENABLED:-true}

  comfyui:
    profiles: [gpu]
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]

  render-worker:
    command: ["rq", "worker", "video", "gpu", "--url", "redis://redis:6379/0"]
    environment:
      COMFYUI_URL: http://comfyui:8188
      COMFYUI_ENABLED: ${COMFYUI_ENABLED:-true}
      WAN_NODE_MAPPING: '{"positive_prompt":["6","text"],"negative_prompt":["7","text"],"seed":["3","seed"],"width":["55","width"],"height":["55","height"],"frames":["55","length"],"fps":["57","fps"]}'
